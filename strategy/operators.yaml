# Model ids and evolution settings mirrored into the OpenEvolve config at run time (run_search.py clamps ranges).
# Default endpoint is Anthropic's OpenAI-compatible API (https://api.anthropic.com/v1/), key from ANTHROPIC_API_KEY.
# Alternative (Gemini free tier, LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/):
#   - {name: gemini-2.5-flash, weight: 0.7}
#   - {name: gemini-2.5-flash-lite, weight: 0.3}
# If LLM_BASE_URL points at a gateway, swap the ids for the gateway's, for example auto/gemini and auto/best-coding.
# temperature must be 1.0 for Claude 4.7+ models (the compatibility layer returns 400 for lower values); top_p stays null.
models:
  - {name: claude-haiku-5-5, weight: 1.0}
temperature: 1.0
top_p: null
max_tokens: 8192
population_size: 200
archive_size: 40
num_islands: 3
migration_interval: 20
migration_rate: 0.1
elite_selection_ratio: 0.1
exploration_ratio: 0.2
exploitation_ratio: 0.7
full_rewrite_probability: 0.1
num_top_programs: 3
num_diverse_programs: 2
eval:
  time_budget_s: 40
  max_candidates: 8
