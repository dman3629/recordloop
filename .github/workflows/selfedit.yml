name: selfedit
on:
  schedule: [{cron: "0 4 * * 3"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recordloop-lane          # shared with search: they never overlap
  cancel-in-progress: false
jobs:
  selfedit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: make -C checker
      - name: Propose, gate, apply
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
        run: |
          python selfedit/propose.py || { echo "no usable proposal"; exit 0; }
          if python selfedit/gate.py | tee gate.log; then
            bash selfedit/apply.sh
          else
            echo "discarded"
          fi
          cat gate.log || true
      - run: |
          git config user.name "Derezar Master"; git config user.email "derezarmaster@gmail.com"
          git add results
          git diff --cached --quiet || git commit -m "results: selfedit $(date +%F)"
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
