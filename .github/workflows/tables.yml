name: tables
on:
  schedule: [{cron: "0 5 * * 0"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: bash tables/refresh.sh
      - run: |
          git config user.name "Derezar Master"; git config user.email "derezarmaster@gmail.com"
          git add tables
          git diff --cached --quiet || git commit -m "tables: refresh $(date +%F)"
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
